# Staff admin dashboard Worker (ADR 0018). Separate from the public app Worker in wrangler.toml.
# The whole Worker sits behind Cloudflare Access; the Access policy names the three admins (their
# emails live only in that policy, never here). The Worker verifies the Access token itself and
# answers 503 until ACCESS_TEAM_DOMAIN and ACCESS_AUD are set. Reads aggregates from the app's D1; its only writes are the three partner actions of ADR 0019, off unless FLAG_PARTNERS is "enabled" here.
name = "pushkara-mitra-admin"
main = "src/admin/index.ts"
compatibility_date = "2026-08-22"
workers_dev = false

# Production: not deployed. ACCESS_TEAM_DOMAIN and ACCESS_AUD are left out until the owner creates a
# separate Access application for it, so every request answers 503. FLAG_PARTNERS stays unset.
[env.production]
name = "pushkara-mitra-admin-production"
workers_dev = false

[env.production.vars]
ENVIRONMENT_NAME = "production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "pushkara-mitra-production"
database_id = "d3117bbc-34d9-4212-bac1-3bf8f35044d1"
migrations_dir = "migrations"

[env.staging]
name = "pushkara-mitra-admin-staging"
workers_dev = true

[env.staging.vars]
ENVIRONMENT_NAME = "staging"
# Cloudflare Access application for this Worker (owner set up 2026-11-23). Not secrets: the team
# domain is public and the AUD tag only identifies the application; tokens are signed by Cloudflare.
ACCESS_TEAM_DOMAIN = "https://sparkling-star-84a3.cloudflareaccess.com"
ACCESS_AUD = "7b856e89b26479ed1c0d6c84f064f411bada86a36aab01f66ea0405373634b0a"
# Partner write actions (ADR 0019). Must match the app Worker; off means the tab only reads.
FLAG_PARTNERS = "enabled"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "pushkara-mitra-staging"
database_id = "3bf2a0ec-4b67-4be5-b537-23fa5b9f5833"
migrations_dir = "migrations"
