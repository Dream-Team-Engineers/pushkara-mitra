# No secrets here. Secrets are set per environment with `wrangler secret put` or GitHub environment secrets.
name = "pushkara-mitra"
main = "src/index.ts"
compatibility_date = "2026-08-22"
workers_dev = false

[assets]
directory = "./public"
binding = "ASSETS"

# Durable Objects: GroupLocation keeps location in memory only (ADR 0004).
# Staging runs on Workers Free, which only offers the SQLite backend, so staging uses
# new_sqlite_classes (ADR 0004 Amendment 1). The SQLite store is provisioned but must never
# be used: no storage API, SQL, alarms or WebSocket attachment serialisation.
# Preview and production keep new_classes until their Cloudflare plan is decided (OQ-020).
# Guard: tests/guards/wrangler-config.test.ts.
[[durable_objects.bindings]]
name = "GROUP_LOCATION"
class_name = "GroupLocation"

[[migrations]]
tag = "v1"
new_classes = ["GroupLocation"]

[env.preview]
name = "pushkara-mitra-preview"
workers_dev = true
[env.preview.assets]
directory = "./public"
binding = "ASSETS"
[[env.preview.durable_objects.bindings]]
name = "GROUP_LOCATION"
class_name = "GroupLocation"
[[env.preview.migrations]]
tag = "v1"
new_classes = ["GroupLocation"]

[env.staging]
name = "pushkara-mitra-staging"
workers_dev = true
[env.staging.assets]
directory = "./public"
binding = "ASSETS"
[[env.staging.durable_objects.bindings]]
name = "GROUP_LOCATION"
class_name = "GroupLocation"
[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["GroupLocation"]

[env.production]
name = "pushkara-mitra-production"
workers_dev = false
[env.production.assets]
directory = "./public"
binding = "ASSETS"
[[env.production.durable_objects.bindings]]
name = "GROUP_LOCATION"
class_name = "GroupLocation"
[[env.production.migrations]]
tag = "v1"
new_classes = ["GroupLocation"]
