# No secrets here. Secrets are set per environment with `wrangler secret put` or GitHub environment secrets.
name = "pushkara-mitra"
main = "src/index.ts"
compatibility_date = "2026-08-22"
workers_dev = false

[assets]
directory = "./dist/web"
binding = "ASSETS"
# Security/method middleware must also wrap assets and asset redirects.
run_worker_first = true

# Durable Objects: GroupLocation keeps location in memory only (ADR 0004).
# Staging runs on Workers Free, which only offers the SQLite backend, so staging uses
# new_sqlite_classes (ADR 0004 Amendment 1). The SQLite store is provisioned but must never
# be used: no storage API, SQL, alarms or WebSocket attachment serialisation.
# Preview proposes the same unused SQLite provisioning for Workers Free (ADR 0004 Amendment 2).
# Amendment 2 is pending human review; this config is not deployment authorization.
# Production also uses new_sqlite_classes as an initial namespace on Workers Free, unused (ADR 0004
# Amendment 3, owner-approved 2026-11-28). The top-level migration keeps new_classes; nothing is reset.
# Guard: tests/guards/wrangler-config.test.ts.
[[durable_objects.bindings]]
name = "GROUP_LOCATION"
class_name = "GroupLocation"

[[migrations]]
tag = "v1"
new_classes = ["GroupLocation"]

[env.preview]
name = "pushkara-mitra-preview"
workers_dev = true
[env.preview.assets]
directory = "./dist/web"
binding = "ASSETS"
# Security/method middleware must also wrap assets and asset redirects.
run_worker_first = true
[[env.preview.durable_objects.bindings]]
name = "GROUP_LOCATION"
class_name = "GroupLocation"
[[env.preview.migrations]]
tag = "v1"
new_sqlite_classes = ["GroupLocation"]

[env.staging]
name = "pushkara-mitra-staging"
workers_dev = true
# Public Google OAuth client ID (not a secret). Switches on Google sign-in for staging only.
[env.staging.vars]
GOOGLE_CLIENT_ID = "433695131529-igclhmojpijekd1nq65m2jnue5rno8tr.apps.googleusercontent.com"
# Lets the map ask for the device position (Permissions-Policy geolocation=(self)). Staging only, OQ-041.
DEVICE_LOCATION = "enabled"
# My Group (ADR 0017): groups and the in-memory live room. Staging only. Without a D1 binding
# (DB) the group routes answer 503 and the app says groups are not available yet.
FLAG_GROUPS = "enabled"
FLAG_GROUP_LOCATION = "enabled"
# App-open counters for the staff dashboard (ADR 0018): counts only, no identifiers.
FLAG_METRICS = "enabled"
# Partners (ADR 0019): apply, availability, inbox, volunteer updates. Staging only; stays off in production.
FLAG_PARTNERS = "enabled"
# Daily sweep (03:30 UTC) that deletes ended groups and the first names on them. No location involved.
[env.staging.triggers]
crons = ["30 3 * * *"]
[env.staging.assets]
directory = "./dist/web"
binding = "ASSETS"
# Security/method middleware must also wrap assets and asset redirects.
run_worker_first = true
[[env.staging.durable_objects.bindings]]
name = "GROUP_LOCATION"
class_name = "GroupLocation"
[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["GroupLocation"]
# D1 for staging (owner approval 2026-11-21): sessions, consent records, groups. No location.
# Created in region APAC; Cloudflare gives no India residency guarantee (OQ-026).
[[env.staging.d1_databases]]
binding = "DB"
database_name = "pushkara-mitra-staging"
database_id = "3bf2a0ec-4b67-4be5-b537-23fa5b9f5833"
migrations_dir = "migrations"

[env.production]
name = "pushkara-mitra-production"
workers_dev = false
# Public address (domain registered 2026-11-28). Cloudflare makes the DNS record and certificate on deploy.
routes = [{ pattern = "pushkaramitra.app", custom_domain = true }]
# Production has no vars block on purpose: every FLAG_*, DEVICE_LOCATION and sign-in stay off until
# the owner turns each one on. SESSION_SECRET is set with `wrangler secret put`, never here.
# Daily sweep (03:30 UTC) for ended groups and the partner retention date. No location involved.
[env.production.triggers]
crons = ["30 3 * * *"]
[env.production.assets]
directory = "./dist/web"
binding = "ASSETS"
# Security/method middleware must also wrap assets and asset redirects.
run_worker_first = true
[[env.production.durable_objects.bindings]]
name = "GROUP_LOCATION"
class_name = "GroupLocation"
[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["GroupLocation"]
# D1 for production (created 2026-11-24, APAC; OQ-026). Migrations 0007 to 0009 are applied
# separately, with the owner's go, before any release. No location.
[[env.production.d1_databases]]
binding = "DB"
database_name = "pushkara-mitra-production"
database_id = "d3117bbc-34d9-4212-bac1-3bf8f35044d1"
migrations_dir = "migrations"
