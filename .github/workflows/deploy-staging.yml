name: Deploy staging

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy:
    name: deploy-staging
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Deploy to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Staging was NOT deployed: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set for the staging environment."
            exit 1
          fi
          npx wrangler deploy --env staging | tee deploy.log
      - name: Smoke test /healthz on the deployed URL
        run: |
          url="$(grep -oE 'https://[^ ]+workers\.dev' deploy.log | head -n 1 || true)"
          if [ -z "$url" ]; then
            echo "::error::Could not find the staging URL in the deploy output."
            exit 1
          fi
          body="$(curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$url/healthz")"
          echo "$url/healthz -> $body"
          [ "$body" = '{"status":"ok"}' ]
