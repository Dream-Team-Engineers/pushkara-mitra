name: Deploy staging

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy:
    name: deploy-staging
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the frontend (wrangler.toml serves dist/web)
        run: npm run build:web
      - name: Deploy to staging
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # pipefail: a failed `wrangler deploy` must fail this step, not be hidden by `tee`.
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Staging was NOT deployed: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set for the staging environment."
            exit 1
          fi
          npx wrangler deploy --env staging 2>&1 | tee deploy.log
          url="$(grep -oE 'https://pushkara-mitra-staging\.[a-z0-9-]+\.workers\.dev' deploy.log | head -n 1 || true)"
          if [ -z "$url" ]; then
            echo "::error::Wrangler reported success but no pushkara-mitra-staging workers.dev URL was found in its output."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test /healthz on the deployed URL
        env:
          STAGING_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          body="$(curl -fsS --retry 5 --retry-delay 3 --retry-all-errors --max-time 10 "$STAGING_URL/healthz")"
          echo "$STAGING_URL/healthz -> $body"
          if [ "$body" != '{"status":"ok"}' ]; then
            echo "::error::Unexpected /healthz response from $STAGING_URL"
            exit 1
          fi
          echo "Staging deployed and healthy: $STAGING_URL/healthz" >> "$GITHUB_STEP_SUMMARY"
