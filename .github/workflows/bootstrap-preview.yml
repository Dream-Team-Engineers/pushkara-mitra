name: Bootstrap preview (manual, one time)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BOOTSTRAP_PREVIEW to authorize the preview-only bootstrap
        required: true
        type: string
      preflight_confirmed:
        description: Confirm intended Free account, no existing preview namespace and an exclusive deployment window
        required: true
        default: false
        type: boolean
      source_pr:
        description: Merged PR number whose merge commit is the selected main SHA
        required: true
        type: string

permissions: {}

concurrency:
  group: bootstrap-preview
  cancel-in-progress: false

jobs:
  bootstrap:
    name: bootstrap-preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: preview
    permissions:
      contents: read
      pull-requests: read # verify the merged source PR; never approve or merge
    steps:
      - name: Validate manual preview intent
        env:
          BOOTSTRAP_EVENT: ${{ github.event_name }}
          BOOTSTRAP_ACTOR: ${{ github.actor }}
          BOOTSTRAP_REF: ${{ github.ref }}
          BOOTSTRAP_CONFIRMATION: ${{ inputs.confirmation }}
          BOOTSTRAP_PR: ${{ inputs.source_pr }}
          BOOTSTRAP_PREFLIGHT: ${{ inputs.preflight_confirmed }}
        run: |
          set -euo pipefail
          if [ "$BOOTSTRAP_EVENT" != workflow_dispatch ] || [ "$BOOTSTRAP_ACTOR" != gkmraju ] || [ "$BOOTSTRAP_REF" != refs/heads/main ] || [ "$BOOTSTRAP_CONFIRMATION" != BOOTSTRAP_PREVIEW ] || [ "$BOOTSTRAP_PREFLIGHT" != true ] || ! [[ "$BOOTSTRAP_PR" =~ ^[0-9]{1,10}$ ]]; then
            echo "::error::Bootstrap requires owner dispatch, manual confirmation, confirmed preflight, main and a numeric merged PR."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify merged source PR matches the immutable main SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BOOTSTRAP_PR: ${{ inputs.source_pr }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          test "$RUN_SHA" = "$current_main" || { echo "::error::Main changed; inspect the current revision."; exit 1; }
          gh api "repos/$REPO/pulls/$BOOTSTRAP_PR" > "$RUNNER_TEMP/preview-pr.json"
          node scripts/verify-preview-bootstrap-review.mjs "$RUNNER_TEMP/preview-pr.json" "$RUN_SHA" "$REPO" "$BOOTSTRAP_PR"
      - run: npm ci
      - run: npm run check
      - name: Recheck main before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          test "$RUN_SHA" = "$current_main" || { echo "::error::Main changed; stop and inspect the new revision."; exit 1; }
      - name: Bootstrap only the missing preview Worker and verify health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          node scripts/bootstrap-preview.mjs
