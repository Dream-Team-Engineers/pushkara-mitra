name: Deploy production

# Retain the callable interface for existing references, but fail closed.
# No credentials, environment or deployment commands are available to this job.
on:
  workflow_call:
    inputs:
      ref:
        description: Release tag (deployment is blocked pending human approval)
        required: true
        type: string

permissions: {}

jobs:
  blocked:
    name: production-release-blocked
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require a reviewed production release process
        run: |
          echo "::error::Production deployment is disabled pending an explicit human release decision and verified independent approval controls."
          exit 1
