name: Preview upload paused (security boundary)

# Do not execute unreviewed PR code with deployment credentials.
# Re-enable upload only after a separately reviewed credential-isolation design.
on:
  workflow_dispatch:

permissions: {}

jobs:
  paused:
    name: preview-upload-paused
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Explain the missing security boundary
        run: |
          echo "::error::Preview upload is paused: automatic PR code must not receive deployment credentials. Use only an approved protected deployment process."
          exit 1
