name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: preview
    # Fork and Dependabot PRs get no secrets, so they are skipped cleanly.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: preview
    permissions:
      contents: read
      pull-requests: write # comment the preview URL on the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Upload preview Worker version (test credentials only)
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Preview NOT deployed: Cloudflare secrets are not set for the preview environment."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          npx wrangler versions upload --env preview --tag "pr-${PR_NUMBER}" \
            --message "Preview for PR ${PR_NUMBER}" | tee upload.log
          url="$(grep -oE 'https://[^ ]+workers\.dev[^ ]*' upload.log | head -n 1 || true)"
          if [ -z "$url" ]; then
            echo "::error::Preview upload returned no workers.dev URL."
            exit 1
          fi
          if ! node --input-type=module -e '
            try {
              const url = new URL(process.argv[1]);
              if (url.protocol !== "https:" || !url.hostname.endsWith(".workers.dev") || url.username || url.password || url.port) process.exit(1);
            } catch { process.exit(1); }
          ' "$url"; then
            echo "::error::Invalid preview workers.dev URL."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL
        if: steps.upload.outputs.deployed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "Preview: ${PREVIEW_URL}"
      - name: Comment that nothing was deployed
        if: failure() && steps.upload.outputs.deployed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO"             --body "Preview NOT deployed: Cloudflare secrets are not set for the preview environment. The preview check failed because no deployment was performed."
