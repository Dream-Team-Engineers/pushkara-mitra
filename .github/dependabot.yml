version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    # Hold TypeScript 7: typescript-eslint (peer range <6.1.0) does not support it and the
    # TS 7 compiler API is unstable, which tests/guards/scan.ts relies on. Remove this
    # ignore once typescript-eslint supports TS 7 and the guards are ported.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci(deps)'
    groups:
      minor-and-patch:
        update-types: [minor, patch]
