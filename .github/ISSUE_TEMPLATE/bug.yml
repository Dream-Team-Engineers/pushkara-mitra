name: Bug
description: Report something that is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste personal data, locations or secrets. Security issues go through private reporting.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device, browser, network condition
  - type: checkboxes
    id: compliance
    attributes:
      label: Compliance impact (tick all that apply)
      options:
        - label: DPDP (personal data, consent, retention, deletion)
        - label: CERT-In (incident reporting, logging)
        - label: Payments
        - label: E-commerce
        - label: Children or dependents
        - label: IP / licence
        - label: Accessibility
        - label: Public safety
